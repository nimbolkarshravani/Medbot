<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedBot · AI Medical Report Analysis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --teal:       #14b8a6;
      --teal-dark:  #0d9488;
      --cyan:       #06b6d4;
      --cyan-dark:  #0891b2;
      --bg-from:    #ecfeff;
      --bg-to:      #f0fdfa;
      --critical:   #ef4444;
      --warning:    #f59e0b;
      --good:       #10b981;
      --info:       #0ea5e9;
      --ink:        #0f172a;
      --muted:      #64748b;
      --border:     rgba(20,184,166,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(150deg, var(--bg-from) 0%, var(--bg-to) 100%);
      min-height: 100vh;
      color: var(--ink);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(20,184,166,.3); border-radius: 99px; }

    /* ── Navbar ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 19px; font-weight: 800; letter-spacing: -.4px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-logo-mark {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; flex-shrink: 0;
    }
    .nav-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 14px;
      background: rgba(16,185,129,.09);
      border: 1px solid rgba(16,185,129,.22);
      border-radius: 99px;
      font-size: 12px; font-weight: 600; color: #059669;
    }
    .nav-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; animation: blink 2s ease infinite; }

    /* ── Hero ── */
    .hero {
      padding: 112px 24px 56px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 18px;
      background: rgba(20,184,166,.1);
      border: 1px solid rgba(20,184,166,.28);
      border-radius: 99px;
      font-size: 13px; font-weight: 600; color: var(--teal-dark);
      margin-bottom: 26px;
      animation: fadeSlideUp .5s ease both;
    }
    .hero-h1 {
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.03em;
      margin-bottom: 20px;
      animation: fadeSlideUp .55s ease both;
    }
    .grad { background: linear-gradient(135deg, var(--teal), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub {
      font-size: 17px; line-height: 1.65; color: var(--muted);
      max-width: 540px; margin-bottom: 48px;
      animation: fadeSlideUp .6s ease both;
    }

    /* ── Main card ── */
    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(20,184,166,.14);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 64px rgba(20,184,166,.13), 0 4px 20px rgba(0,0,0,.05);
      animation: fadeSlideUp .65s ease both;
    }
    .upload-card { width: 100%; max-width: 660px; }

    /* ── Floating-label input ── */
    .field { position: relative; margin-bottom: 24px; }
    .field-label {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: var(--muted); pointer-events: none;
      transition: all .18s ease;
    }
    .field-label.up { top: 11px; transform: none; font-size: 11px; font-weight: 600; color: var(--teal); }
    .field-input {
      width: 100%; padding: 22px 16px 8px;
      border: 1.5px solid rgba(20,184,166,.22);
      border-radius: 13px; font-size: 14px;
      background: rgba(255,255,255,.7); color: var(--ink);
      outline: none; transition: all .2s;
    }
    .field-input:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 3px rgba(20,184,166,.11); }

    /* ── Drop zone ── */
    .dropzone {
      border: 2px dashed rgba(20,184,166,.32);
      border-radius: 18px; padding: 52px 32px;
      text-align: center; cursor: pointer;
      background: rgba(20,184,166,.025);
      transition: all .28s ease; position: relative; overflow: hidden;
    }
    .dropzone:hover, .dropzone.over {
      border-color: var(--teal); background: rgba(20,184,166,.07);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(20,184,166,.14);
    }
    .dropzone.over { border-style: solid; }
    .dz-icon {
      width: 68px; height: 68px; margin: 0 auto 18px;
      background: linear-gradient(135deg, rgba(20,184,166,.15), rgba(6,182,212,.15));
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 30px; transition: transform .28s ease;
    }
    .dropzone:hover .dz-icon { transform: scale(1.1) rotate(-6deg); }
    .dz-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .dz-sub { font-size: 13px; color: var(--muted); }
    .dz-badges { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .dz-badge { padding: 4px 13px; background: rgba(20,184,166,.1); border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--teal-dark); }

    /* ── File chip ── */
    .file-chip {
      display: flex; align-items: center; gap: 13px;
      padding: 15px 18px;
      background: rgba(20,184,166,.08);
      border: 1px solid rgba(20,184,166,.2);
      border-radius: 13px; margin-top: 16px;
      animation: fadeSlideUp .3s ease both;
    }
    .file-chip-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: #fff;
    }
    .file-chip-info { flex: 1; min-width: 0; }
    .file-chip-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-chip-size { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .file-chip-rm { padding: 7px; background: none; border: none; cursor: pointer; color: var(--muted); border-radius: 8px; font-size: 16px; line-height: 1; transition: all .18s; }
    .file-chip-rm:hover { background: rgba(239,68,68,.1); color: var(--critical); }

    /* ── Primary button ── */
    .btn {
      width: 100%; padding: 16px 24px; margin-top: 24px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      color: #fff; border: none; border-radius: 13px;
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      cursor: pointer; position: relative; overflow: hidden;
      transition: all .28s ease;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
      transform: translateX(-100%); transition: transform .55s ease;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(20,184,166,.42); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .note { text-align: center; margin-top: 16px; font-size: 12px; color: #94a3b8; }

    /* ── Feature strip ── */
    .features {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 24px 36px; margin-top: 48px;
      animation: fadeSlideUp .7s ease both;
    }
    .feat { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .feat-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--cyan)); flex-shrink: 0; }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(10,20,30,.52); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: fadeIn .28s ease;
    }
    .modal {
      background: #fff; border-radius: 24px; padding: 40px;
      max-width: 596px; width: 100%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 40px 80px rgba(0,0,0,.22);
      animation: scaleIn .3s ease both;
    }
    .modal-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 15px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 18px;
    }
    .modal-h { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 24px; }

    .prog-wrap { height: 5px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
    .prog-bar { height: 100%; background: linear-gradient(90deg, var(--teal), var(--cyan)); border-radius: 99px; transition: width .5s ease; }

    .preview-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .preview-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 18px 20px; max-height: 192px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 12.5px; line-height: 1.65;
      color: #374151; margin-bottom: 24px;
    }
    mark.pii {
      background: rgba(239,68,68,.1); color: #dc2626;
      border-radius: 4px; padding: 1px 5px;
      font-weight: 700; font-size: 11px;
    }

    .consent-row {
      display: flex; align-items: flex-start; gap: 13px;
      padding: 15px 18px;
      border: 1.5px solid #e2e8f0; border-radius: 13px; margin-bottom: 11px;
      cursor: pointer; transition: all .18s;
    }
    .consent-row:hover { border-color: var(--teal); background: rgba(20,184,166,.03); }
    .consent-row.on { border-color: var(--teal); background: rgba(20,184,166,.05); }
    .cb {
      width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
      border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; transition: all .18s; margin-top: 2px;
    }
    .cb.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    .ct-label { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .ct-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .modal-btns { display: flex; gap: 11px; margin-top: 24px; }
    .btn-ghost {
      flex: 1; padding: 14px; background: #f1f5f9; color: var(--muted);
      border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .18s;
    }
    .btn-ghost:hover { background: #e2e8f0; }
    .btn-confirm {
      flex: 2; padding: 14px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(20,184,166,.36); }
    .btn-confirm:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Loading ── */
    .loading-wrap { max-width: 640px; margin: 100px auto 0; padding: 0 24px; }
    .loading-card {
      background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
      border: 1px solid rgba(20,184,166,.14); border-radius: 24px;
      padding: 64px 40px; text-align: center;
      box-shadow: 0 20px 64px rgba(20,184,166,.13);
      animation: fadeSlideUp .5s ease both;
    }
    .spinner {
      width: 64px; height: 64px; margin: 0 auto 28px;
      border: 4px solid rgba(20,184,166,.2);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-h { font-size: 23px; font-weight: 800; margin-bottom: 8px; }
    .loading-sub { font-size: 14px; color: var(--muted); }
    .steps { list-style: none; margin-top: 36px; text-align: left; max-width: 340px; margin-left: auto; margin-right: auto; }
    .step { display: flex; align-items: center; gap: 13px; padding: 9px 0; font-size: 14px; color: var(--muted); transition: all .3s; }
    .step.active { color: var(--teal); font-weight: 600; }
    .step.done { color: var(--good); }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; transition: all .3s; }
    .step.active .step-dot { background: var(--teal); animation: pulse 1.1s ease infinite; }
    .step.done .step-dot { background: var(--good); }

    /* ── Results ── */
    .results-wrap { max-width: 800px; margin: 88px auto 0; padding: 0 24px 100px; }
    .results-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    .results-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
    .results-h { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
    .btn-reset {
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
      padding: 10px 20px;
      background: rgba(20,184,166,.1); color: var(--teal-dark);
      border: 1px solid rgba(20,184,166,.24); border-radius: 99px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-reset:hover { background: rgba(20,184,166,.18); transform: translateY(-1px); }

    /* ── Severity card ── */
    .sev-card {
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 24px; padding: 40px;
      color: #fff; margin-bottom: 24px;
      box-shadow: 0 24px 64px rgba(20,184,166,.38);
      position: relative; overflow: hidden;
      animation: fadeSlideUp .55s ease both;
    }
    .sev-card::before {
      content: ''; position: absolute; top: -60px; right: -60px;
      width: 220px; height: 220px; background: rgba(255,255,255,.08); border-radius: 50%;
    }
    .sev-card::after {
      content: ''; position: absolute; bottom: -36px; left: 36px;
      width: 140px; height: 140px; background: rgba(255,255,255,.05); border-radius: 50%;
    }
    .sev-row { display: flex; align-items: center; gap: 40px; position: relative; z-index: 1; }
    .sev-ring { flex-shrink: 0; width: 130px; height: 130px; position: relative; }
    .sev-ring svg { transform: rotate(-90deg); }
    .sev-num-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .sev-num { font-size: 42px; font-weight: 900; line-height: 1; }
    .sev-denom { font-size: 13px; opacity: .72; }
    .dr-pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 9px 16px; background: rgba(255,255,255,.17);
      border-radius: 99px; font-size: 13px; font-weight: 600; margin-bottom: 18px;
    }
    .dr-avatar {
      width: 26px; height: 26px; background: rgba(255,255,255,.25);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .sev-label { font-size: 12px; opacity: .78; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 7px; }
    .sev-title { font-size: 28px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 12px; }
    .sev-summary { font-size: 15px; opacity: .92; line-height: 1.65; }
    .sev-note {
      margin-top: 16px; padding: 13px 16px;
      background: rgba(255,255,255,.16); border-radius: 12px;
      font-size: 13px; font-style: italic; opacity: .96; line-height: 1.55;
    }
    .sev-counts { display: flex; gap: 11px; margin-top: 22px; position: relative; z-index: 1; }
    .sev-count-pill { padding: 6px 16px; border-radius: 99px; font-size: 13px; font-weight: 700; }
    .sev-count-pill.c { background: rgba(239,68,68,.22); }
    .sev-count-pill.w { background: rgba(245,158,11,.22); }

    /* ── Section header ── */
    .sec-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .sec-title { font-size: 18px; font-weight: 800; }
    .sec-badge { padding: 4px 13px; background: rgba(20,184,166,.1); border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--teal-dark); }

    /* ── Finding card ── */
    .findings { display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
    .finding {
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06); border-radius: 17px;
      padding: 20px 22px; display: flex; align-items: flex-start; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04); transition: all .22s;
      animation: fadeSlideUp .6s ease both;
    }
    .finding:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.08); }
    .f-icon {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .f-icon.critical { background: rgba(239,68,68,.1); }
    .f-icon.warning  { background: rgba(245,158,11,.1); }
    .f-icon.normal   { background: rgba(16,185,129,.1); }
    .f-body { flex: 1; min-width: 0; }
    .f-cat { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .f-cat.critical { color: var(--critical); }
    .f-cat.warning  { color: var(--warning); }
    .f-cat.normal   { color: var(--good); }
    .f-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .f-desc  { font-size: 13px; color: var(--muted); line-height: 1.55; }
    .f-badge { padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; flex-shrink: 0; align-self: flex-start; }
    .f-badge.critical { background: rgba(239,68,68,.1); color: var(--critical); }
    .f-badge.warning  { background: rgba(245,158,11,.1); color: #d97706; }
    .f-badge.normal   { background: rgba(16,185,129,.1); color: #059669; }

    /* ── Action card ── */
    .actions { display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
    .action {
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06); border-radius: 17px;
      padding: 20px 22px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04); transition: all .22s;
      animation: fadeSlideUp .6s ease both;
    }
    .action:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.08); border-color: rgba(20,184,166,.2); }
    .action-num {
      width: 38px; height: 38px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 11px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
    }
    .action-text { font-size: 14px; line-height: 1.55; }

    /* ── Disclaimer ── */
    .disclaimer {
      text-align: center; margin-top: 40px; padding: 20px 24px;
      background: rgba(255,255,255,.62); border-radius: 16px;
      font-size: 12.5px; color: #94a3b8;
      border: 1px solid rgba(0,0,0,.05);
    }

    /* ── Chat ── */
    .chat-section {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(20,184,166,.14);
      border-radius: 24px;
      margin-top: 24px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.05);
      animation: fadeSlideUp .7s ease both;
    }
    .chat-head {
      padding: 22px 28px 18px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 14px;
    }
    .chat-head-icon {
      width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .chat-head-title { font-size: 17px; font-weight: 800; }
    .chat-head-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Suggestions (empty state) */
    .chat-suggestions { padding: 24px 28px; }
    .chat-hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 16px; border-radius: 99px;
      font-size: 13px; font-weight: 500;
      background: rgba(20,184,166,.08); color: var(--teal-dark);
      border: 1px solid rgba(20,184,166,.22);

    if (!res.ok) {

async function readPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({
    data: buf
  }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const ct = await page.getTextContent();
    pages.push(ct.items.map(x => x.str).join(' '));
  }
  return pages.join('\n');
}
async function readFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  return ext === 'pdf' ? readPDF(file) : file.text();
}
