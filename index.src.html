<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedBot · AI Medical Report Analysis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --teal:       #14b8a6;
      --teal-dark:  #0d9488;
      --cyan:       #06b6d4;
      --cyan-dark:  #0891b2;
      --bg-from:    #ecfeff;
      --bg-to:      #f0fdfa;
      --critical:   #ef4444;
      --warning:    #f59e0b;
      --good:       #10b981;
      --info:       #0ea5e9;
      --ink:        #0f172a;
      --muted:      #64748b;
      --border:     rgba(20,184,166,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(150deg, var(--bg-from) 0%, var(--bg-to) 100%);
      min-height: 100vh;
      color: var(--ink);
      padding-top: 120px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(20,184,166,.3); border-radius: 99px; }

    /* ── Navbar ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; flex-direction: column;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav > div:first-child {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 64px; border-bottom: 1px solid var(--border);
    }
    .nav > div:last-child {
      display: flex; gap: 0; padding: 0 32px; border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 19px; font-weight: 800; letter-spacing: -.4px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-logo-mark {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; flex-shrink: 0;
    }
    .nav-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 14px;
      background: rgba(16,185,129,.09);
      border: 1px solid rgba(16,185,129,.22);
      border-radius: 99px;
      font-size: 12px; font-weight: 600; color: #059669;
    }
    .nav-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; animation: blink 2s ease infinite; }

    /* ── Hero ── */
    .hero {
      padding: 112px 24px 56px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 18px;
      background: rgba(20,184,166,.1);
      border: 1px solid rgba(20,184,166,.28);
      border-radius: 99px;
      font-size: 13px; font-weight: 600; color: var(--teal-dark);
      margin-bottom: 26px;
      animation: fadeSlideUp .5s ease both;
    }
    .hero-h1 {
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.03em;
      margin-bottom: 20px;
      animation: fadeSlideUp .55s ease both;
    }
    .grad { background: linear-gradient(135deg, var(--teal), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub {
      font-size: 17px; line-height: 1.65; color: var(--muted);
      max-width: 540px; margin-bottom: 48px;
      animation: fadeSlideUp .6s ease both;
    }

    /* ── Main card ── */
    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(20,184,166,.14);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 64px rgba(20,184,166,.13), 0 4px 20px rgba(0,0,0,.05);
      animation: fadeSlideUp .65s ease both;
    }
    .upload-card { width: 100%; max-width: 660px; }

    /* ── Floating-label input ── */
    .field { position: relative; margin-bottom: 24px; }
    .field-label {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: var(--muted); pointer-events: none;
      transition: all .18s ease;
    }
    .field-label.up { top: 11px; transform: none; font-size: 11px; font-weight: 600; color: var(--teal); }
    .field-input {
      width: 100%; padding: 22px 16px 8px;
      border: 1.5px solid rgba(20,184,166,.22);
      border-radius: 13px; font-size: 14px;
      background: rgba(255,255,255,.7); color: var(--ink);
      outline: none; transition: all .2s;
    }
    .field-input:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 3px rgba(20,184,166,.11); }

    /* ── Drop zone ── */
    .dropzone {
      border: 2px dashed rgba(20,184,166,.32);
      border-radius: 18px; padding: 52px 32px;
      text-align: center; cursor: pointer;
      background: rgba(20,184,166,.025);
      transition: all .28s ease; position: relative; overflow: hidden;
    }
    .dropzone:hover, .dropzone.over {
      border-color: var(--teal); background: rgba(20,184,166,.07);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(20,184,166,.14);
    }
    .dropzone.over { border-style: solid; }
    .dz-icon {
      width: 68px; height: 68px; margin: 0 auto 18px;
      background: linear-gradient(135deg, rgba(20,184,166,.15), rgba(6,182,212,.15));
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 30px; transition: transform .28s ease;
    }
    .dropzone:hover .dz-icon { transform: scale(1.1) rotate(-6deg); }
    .dz-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .dz-sub { font-size: 13px; color: var(--muted); }
    .dz-badges { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .dz-badge { padding: 4px 13px; background: rgba(20,184,166,.1); border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--teal-dark); }

    /* ── File chip ── */
    .file-chip {
      display: flex; align-items: center; gap: 13px;
      padding: 15px 18px;
      background: rgba(20,184,166,.08);
      border: 1px solid rgba(20,184,166,.2);
      border-radius: 13px; margin-top: 16px;
      animation: fadeSlideUp .3s ease both;
    }
    .file-chip-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: #fff;
    }
    .file-chip-info { flex: 1; min-width: 0; }
    .file-chip-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-chip-size { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .file-chip-rm { padding: 7px; background: none; border: none; cursor: pointer; color: var(--muted); border-radius: 8px; font-size: 16px; line-height: 1; transition: all .18s; }
    .file-chip-rm:hover { background: rgba(239,68,68,.1); color: var(--critical); }

    /* ── Primary button ── */
    .btn {
      width: 100%; padding: 16px 24px; margin-top: 24px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      color: #fff; border: none; border-radius: 13px;
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      cursor: pointer; position: relative; overflow: hidden;
      transition: all .28s ease;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
      transform: translateX(-100%); transition: transform .55s ease;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(20,184,166,.42); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .note { text-align: center; margin-top: 16px; font-size: 12px; color: #94a3b8; }

    /* ── Feature strip ── */
    .features {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 24px 36px; margin-top: 48px;
      animation: fadeSlideUp .7s ease both;
    }
    .feat { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .feat-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--cyan)); flex-shrink: 0; }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(10,20,30,.52); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: fadeIn .28s ease;
    }
    .modal {
      background: #fff; border-radius: 24px; padding: 40px;
      max-width: 596px; width: 100%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 40px 80px rgba(0,0,0,.22);
      animation: scaleIn .3s ease both;
    }
    .modal-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 15px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 18px;
    }
    .modal-h { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 24px; }

    .prog-wrap { height: 5px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
    .prog-bar { height: 100%; background: linear-gradient(90deg, var(--teal), var(--cyan)); border-radius: 99px; transition: width .5s ease; }

    .preview-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .preview-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 18px 20px; max-height: 192px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 12.5px; line-height: 1.65;
      color: #374151; margin-bottom: 24px;
    }
    mark.pii {
      background: rgba(239,68,68,.1); color: #dc2626;
      border-radius: 4px; padding: 1px 5px;
      font-weight: 700; font-size: 11px;
    }

    .consent-row {
      display: flex; align-items: flex-start; gap: 13px;
      padding: 15px 18px;
      border: 1.5px solid #e2e8f0; border-radius: 13px; margin-bottom: 11px;
      cursor: pointer; transition: all .18s;
    }
    .consent-row:hover { border-color: var(--teal); background: rgba(20,184,166,.03); }
    .consent-row.on { border-color: var(--teal); background: rgba(20,184,166,.05); }
    .cb {
      width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
      border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; transition: all .18s; margin-top: 2px;
    }
    .cb.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    .ct-label { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .ct-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .modal-btns { display: flex; gap: 11px; margin-top: 24px; }
    .btn-ghost {
      flex: 1; padding: 14px; background: #f1f5f9; color: var(--muted);
      border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .18s;
    }
    .btn-ghost:hover { background: #e2e8f0; }
    .btn-confirm {
      flex: 2; padding: 14px;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(20,184,166,.36); }
    .btn-confirm:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Loading ── */
    .loading-wrap { max-width: 640px; margin: 100px auto 0; padding: 0 24px; }
    .loading-card {
      background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
      border: 1px solid rgba(20,184,166,.14); border-radius: 24px;
      padding: 64px 40px; text-align: center;
      box-shadow: 0 20px 64px rgba(20,184,166,.13);
      animation: fadeSlideUp .5s ease both;
    }
    .spinner {
      width: 64px; height: 64px; margin: 0 auto 28px;
      border: 4px solid rgba(20,184,166,.2);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-h { font-size: 23px; font-weight: 800; margin-bottom: 8px; }
    .loading-sub { font-size: 14px; color: var(--muted); }
    .steps { list-style: none; margin-top: 36px; text-align: left; max-width: 340px; margin-left: auto; margin-right: auto; }
    .step { display: flex; align-items: center; gap: 13px; padding: 9px 0; font-size: 14px; color: var(--muted); transition: all .3s; }
    .step.active { color: var(--teal); font-weight: 600; }
    .step.done { color: var(--good); }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; transition: all .3s; }
    .step.active .step-dot { background: var(--teal); animation: pulse 1.1s ease infinite; }
    .step.done .step-dot { background: var(--good); }

    /* ── Results ── */
    .results-wrap { max-width: 800px; margin: 88px auto 0; padding: 0 24px 100px; }
    .results-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    .results-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
    .results-h { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
    .btn-reset {
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
      padding: 10px 20px;
      background: rgba(20,184,166,.1); color: var(--teal-dark);
      border: 1px solid rgba(20,184,166,.24); border-radius: 99px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-reset:hover { background: rgba(20,184,166,.18); transform: translateY(-1px); }

    /* ── Severity card ── */
    .sev-card {
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 24px; padding: 40px;
      color: #fff; margin-bottom: 24px;
      box-shadow: 0 24px 64px rgba(20,184,166,.38);
      position: relative; overflow: hidden;
      animation: fadeSlideUp .55s ease both;
    }
    .sev-card::before {
      content: ''; position: absolute; top: -60px; right: -60px;
      width: 220px; height: 220px; background: rgba(255,255,255,.08); border-radius: 50%;
    }
    .sev-card::after {
      content: ''; position: absolute; bottom: -36px; left: 36px;
      width: 140px; height: 140px; background: rgba(255,255,255,.05); border-radius: 50%;
    }
    .sev-row { display: flex; align-items: center; gap: 40px; position: relative; z-index: 1; }
    .sev-ring { flex-shrink: 0; width: 130px; height: 130px; position: relative; }
    .sev-ring svg { transform: rotate(-90deg); }
    .sev-num-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .sev-num { font-size: 42px; font-weight: 900; line-height: 1; }
    .sev-denom { font-size: 13px; opacity: .72; }
    .dr-pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 9px 16px; background: rgba(255,255,255,.17);
      border-radius: 99px; font-size: 13px; font-weight: 600; margin-bottom: 18px;
    }
    .dr-avatar {
      width: 26px; height: 26px; background: rgba(255,255,255,.25);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .sev-label { font-size: 12px; opacity: .78; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 7px; }
    .sev-title { font-size: 28px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 12px; }
    .sev-summary { font-size: 15px; opacity: .92; line-height: 1.65; }
    .sev-note {
      margin-top: 16px; padding: 13px 16px;
      background: rgba(255,255,255,.16); border-radius: 12px;
      font-size: 13px; font-style: italic; opacity: .96; line-height: 1.55;
    }
    .sev-counts { display: flex; gap: 11px; margin-top: 22px; position: relative; z-index: 1; }
    .sev-count-pill { padding: 6px 16px; border-radius: 99px; font-size: 13px; font-weight: 700; }
    .sev-count-pill.c { background: rgba(239,68,68,.22); }
    .sev-count-pill.w { background: rgba(245,158,11,.22); }

    /* ── Section header ── */
    .sec-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .sec-title { font-size: 18px; font-weight: 800; }
    .sec-badge { padding: 4px 13px; background: rgba(20,184,166,.1); border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--teal-dark); }

    /* ── Finding card ── */
    .findings { display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
    .finding {
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06); border-radius: 17px;
      padding: 20px 22px; display: flex; align-items: flex-start; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04); transition: all .22s;
      animation: fadeSlideUp .6s ease both;
    }
    .finding:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.08); }
    .f-icon {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .f-icon.critical { background: rgba(239,68,68,.1); }
    .f-icon.warning  { background: rgba(245,158,11,.1); }
    .f-icon.normal   { background: rgba(16,185,129,.1); }
    .f-body { flex: 1; min-width: 0; }
    .f-cat { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .f-cat.critical { color: var(--critical); }
    .f-cat.warning  { color: var(--warning); }
    .f-cat.normal   { color: var(--good); }
    .f-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .f-desc  { font-size: 13px; color: var(--muted); line-height: 1.55; }
    .f-badge { padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; flex-shrink: 0; align-self: flex-start; }
    .f-badge.critical { background: rgba(239,68,68,.1); color: var(--critical); }
    .f-badge.warning  { background: rgba(245,158,11,.1); color: #d97706; }
    .f-badge.normal   { background: rgba(16,185,129,.1); color: #059669; }

    /* ── Action card ── */
    .actions { display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
    .action {
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06); border-radius: 17px;
      padding: 20px 22px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04); transition: all .22s;
      animation: fadeSlideUp .6s ease both;
    }
    .action:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.08); border-color: rgba(20,184,166,.2); }
    .action-num {
      width: 38px; height: 38px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      border-radius: 11px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
    }
    .action-text { font-size: 14px; line-height: 1.55; }

    /* ── Disclaimer ── */
    .disclaimer {
      text-align: center; margin-top: 40px; padding: 20px 24px;
      background: rgba(255,255,255,.62); border-radius: 16px;
      font-size: 12.5px; color: #94a3b8;
      border: 1px solid rgba(0,0,0,.05);
    }

    /* ── Chat ── */
    .chat-section {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(20,184,166,.14);
      border-radius: 24px;
      margin-top: 24px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.05);
      animation: fadeSlideUp .7s ease both;
    }
    .chat-head {
      padding: 22px 28px 18px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 14px;
    }
    .chat-head-icon {
      width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--cyan));
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .chat-head-title { font-size: 17px; font-weight: 800; }
    .chat-head-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Suggestions (empty state) */

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Config — injected at build time by build.js ────────────────────────── */
const GEMINI_API_KEY = '';
/* ──────────────────────────────────────────────────────────────────────── */

/* ── Backend API (cookies + Authorization header fallback) ── */
let _authToken = sessionStorage.getItem('medbot_token') || '';

async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (_authToken) {
    headers['Authorization'] = 'Bearer ' + _authToken;
  }
  const res = await fetch('/api' + path, { ...options, headers, credentials: 'include' });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'HTTP ' + res.status);
  return res.json();
}

/* ── Auth hook (email + password via backend) ── */
function useAuth() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authEnabled, setAuthEnabled] = useState(true);

  useEffect(() => {
    const headers = {};
    if (_authToken) headers['Authorization'] = 'Bearer ' + _authToken;
    fetch('/api/me', { credentials: 'include', headers })
      .then(r => {
        if (r.status === 401) {
          _authToken = '';
          sessionStorage.removeItem('medbot_token');
          return null;
        }
        if (!r.ok) throw new Error('Backend unavailable');
        return r.json();
      })
      .then(data => { if (data) setUser(data); })
      .catch(() => setAuthEnabled(false))
      .finally(() => setLoading(false));
  }, []);

  const signUp = async (email, password) => {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      return { error: { message: data.detail || 'Signup failed' } };
    }
    const data = await res.json();
    setUser(data.user);
    return { error: null };
  };

  const signIn = async (email, password) => {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      return { error: { message: data.detail || 'Login failed' } };
    }
    const data = await res.json();
    if (data.access_token) {
      _authToken = data.access_token;
      sessionStorage.setItem('medbot_token', data.access_token);
    }
    setUser(data.user);
    return { error: null };
  };

  const signOut = async () => {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    _authToken = '';
    sessionStorage.removeItem('medbot_token');
    setUser(null);
  };

  return { user, loading, authEnabled, signUp, signIn, signOut };
}

/* ── PII patterns ─────────────────────────────────────────────────────── */
const PII = [
  { r: /(?:Patient\s*(?:Name)?|Name|Referring\s+(?:Physician|Doctor)|Ordering\s+(?:Physician|Doctor)|Attending|Reviewed\s+by|Reported\s+by|Collected\s+by|Performed\s+by)\s*[:\-]?\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+/g, t: '[NAME]' },
  { r: /\b(Mr|Mrs|Ms|Dr|Prof)\.?\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+/g, t: '[NAME]' },
  { r: /\b[A-Z][a-z]+ [A-Z][a-z]+\b(?=\s*,?\s*(?:MD|DO|RN|PhD|NP|PA))/g, t: '[PROVIDER]' },
  { r: /\b(?:SSN|Social Security(?:\s+Number)?)[\s:#]*\d{3}[-\s]?\d{2}[-\s]?\d{4}/gi, t: '[SSN]' },
  { r: /\b\d{3}[- ]?\d{2}[- ]?\d{4}\b(?!\d)/g, t: '[SSN]' },
  { r: /\bMRN[\s:#]*[A-Z0-9\-]+/gi, t: '[MRN]' },
  { r: /\bPatient\s+(?:ID|Number)[\s:#]*[A-Z0-9\-]+/gi, t: '[PATIENT-ID]' },
  { r: /\b(?:\+1[-.\s]?)?\(?[0-9]{3}\)?[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}\b/g, t: '[PHONE]' },
  { r: /\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b/g, t: '[EMAIL]' },
  { r: /\b\d+\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl)\b(?:[^,\n]{0,40})?/gi, t: '[ADDRESS]' },
  { r: /\b(?:DOB|Date of Birth|Birth Date|Born(?:\s+on)?)[\s:]*(?:\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4})\b/gi, t: '[DOB]' },
  { r: /\b(?:0[1-9]|1[0-2])[\/\-](?:0[1-9]|[12]\d|3[01])[\/\-](?:19|20)\d{2}\b/g, t: '[DOB]' },
  { r: /\b(?:Memorial|General|Community|Regional|University|St\.?\s+[A-Z][a-z]+|[A-Z][a-z]+ Medical|[A-Z][a-z]+ Health(?:care)?)\s+(?:Hospital|Clinic|Medical Center|Health System|Health Center|Centre)\b/gi, t: '[FACILITY]' },
];

function redact(text) {
  let out = text;
  for (const { r, t } of PII) out = out.replace(new RegExp(r.source, r.flags), t);
  return out;
}

function highlight(text) {
  let out = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  for (const { r, t } of PII) {
    out = out.replace(new RegExp(r.source, r.flags), `<mark class="pii">${t}</mark>`);
  }
  return out;
}

/* ── Error classification ───────────────────────────────────────────────── */
function isRetryable(err) {
  return /503|429|overload|high.?demand|busy|quota|rate.?limit|too.?many|unavailable/i.test(
    err.message || ''
  );
}

/* ── PDF / text extraction ─────────────────────────────────────────────── */
async function readPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const ct = await page.getTextContent();
    pages.push(ct.items.map(x => x.str).join(' '));
  }
  return pages.join('\n');
}

async function readFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  return ext === 'pdf' ? readPDF(file) : file.text();
}

async function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve(result.split(',')[1] || '');
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ── Backend RAG API calls ──────────────────────────────────────────────── */
async function uploadReport(fileName, text) {
  return apiFetch('/reports/upload', {
    method: 'POST',
    body: JSON.stringify({ file_name: fileName, text }),

async function analyzeReport(reportId) {

}

async function chatWithReport(reportId, question, history) {

async function deleteReport(reportId) {

/* ── Fallback: Direct Gemini API (when backend unavailable) ────────────── */
const PROMPT = (report) => `You are a warm, friendly doctor explaining medical results in simple language a patient can understand. Analyze this medical report.
Reply ONLY with valid JSON (no markdown fences, no extra text) matching this exact structure:
{
  "reportType": "short report type",
  "healthScore": <integer 1-10, where 1=critical emergency, 10=perfect health>,
  "summary": "One sentence overall health picture in plain English",
  "findings": [
    { "category": "critical|warning|normal", "title": "...", "description": "Max 2 plain-English sentences. Explain jargon." }
  ],
  "actions": ["Action 1", "Action 2", "Action 3"],
  "drAidenNote": "Warm, reassuring 1-sentence note to help the patient feel informed and supported"
}

Rules: max 6 findings, prioritize critical first, plain English throughout, no jargon without explanation.

Medical Report:
${report}`;

async function callGemini(apiKey, text) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: PROMPT(text) }] }],
        generationConfig: { temperature: 0.25, maxOutputTokens: 2048 }
      })
    }
  );
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const m = raw.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No valid JSON in Gemini response.');
  return JSON.parse(m[0]);
}

/* ── Toast hook ─────────────────────────────────────────────────────────── */
function useToast() {
  const [list, setList] = useState([]);
  const add = useCallback((msg, type = 'info') => {
    const id = Date.now();
    setList(p => [...p, { id, msg, type }]);
    setTimeout(() => setList(p => p.filter(t => t.id !== id)), 3600);
  }, []);
  return { list, add };
}

/* ── Severity ring ──────────────────────────────────────────────────────── */
function Ring({ score }) {
  const R = 52, C = 2 * Math.PI * R;
  const dash = C * (score / 10);
  return (
    <div className="sev-ring">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r={R} fill="none" stroke="rgba(255,255,255,.22)" strokeWidth="10"/>
        <circle cx="65" cy="65" r={R} fill="none" stroke="#fff" strokeWidth="10"
          strokeDasharray={`${dash} ${C}`} strokeLinecap="round"
          style={{ transition: 'stroke-dasharray 1.6s cubic-bezier(.22,1,.36,1)' }}/>
      </svg>
      <div className="sev-num-wrap">
        <span className="sev-num">{score}</span>
        <span className="sev-denom">/10</span>
      </div>
    </div>
  );
}

  return (

    </div>
  );
}

/* ── Chat component ─────────────────────────────────────────────────────── */
const SUGGESTIONS = [
  "Should I be worried about these results?",
  "What does this mean for my daily life?",
  "How can I improve my health score?",
  "Do I need to see a doctor urgently?",
  "What does LDL mean?",
  "How can I lower my cholesterol?",
];

function Chat({ reportId, reportText, analysis, apiKey }) {
  const [msgs, setMsgs]   = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy]   = useState(false);
  const bottomRef  = useRef(null);
  const textareaRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs, busy]);

  const send = async (text) => {
    const q = (text ?? input).trim();
    if (!q || busy) return;
    setInput('');
    setBusy(true);
    const snapshot = [...msgs];
    setMsgs(p => [...p, { role: 'user', text: q }]);
    try {
      let reply;
      if (reportId) {
        const res = await chatWithReport(reportId, q, snapshot);
        reply = res.reply;
      } else {
        reply = "Chat requires a processed report. Please upload and analyze a report first.";
      }
      setMsgs(p => [...p, { role: 'bot', text: reply }]);
    } catch (e) {
      if (isRetryable(e)) {
        setMsgs(p => [...p, { role: 'error', question: q, snapshot }]);
      } else {
        setMsgs(p => [...p, { role: 'bot', text: `Sorry, something went wrong: ${e.message}` }]);
      }
    } finally {
      setBusy(false);
      setTimeout(() => textareaRef.current?.focus(), 50);
    }
  };

  const retryChat = async (question, snapshot) => {
    setMsgs(p => p.filter(m => !(m.role === 'error' && m.question === question)));
    setBusy(true);
    try {
      let reply;
      if (reportId) {
        const res = await chatWithReport(reportId, question, snapshot);
        reply = res.reply;
      } else {
        reply = "Chat requires a processed report.";
      }
      setMsgs(p => [...p, { role: 'bot', text: reply }]);
    } catch (e) {
      if (isRetryable(e)) {
        setMsgs(p => [...p, { role: 'error', question, snapshot }]);
      } else {
        setMsgs(p => [...p, { role: 'bot', text: `Sorry, something went wrong: ${e.message}` }]);
      }
    } finally {
      setBusy(false);
      setTimeout(() => textareaRef.current?.focus(), 50);
    }
  };

  const onKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  /* Auto-resize textarea */
  const onInput = e => {
    setInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
  };

  const shownChips = msgs.length === 0
    ? SUGGESTIONS                  // all 6 in empty state
    : SUGGESTIONS.slice(0, 3);     // 3 inline chips after chat starts

  return (
    <div className="chat-section">
      {/* Header */}
      <div className="chat-head">
        <div className="chat-head-icon">💬</div>
        <div>
          <div className="chat-head-title">Ask MedBot</div>
          <div className="chat-head-sub">Follow-up questions about your report</div>
        </div>
      </div>

      {/* Empty state — suggestions */}
      {msgs.length === 0 && (
        <div className="chat-suggestions">
          <div className="chat-hint">Tap a question to get started, or type your own below ↓</div>
          <div className="chips">
            {shownChips.map(s => (
              <button key={s} className="chip" onClick={() => send(s)} disabled={busy}>{s}</button>
            ))}
          </div>
        </div>
      )}

      {/* Message list */}
      {msgs.length > 0 && (
        <div className="chat-msgs">
          {msgs.map((m, i) => {
            if (m.role === 'error') return (
              <div key={i} className="msg bot">
                <div className="msg-av">👨‍⚕️</div>
                <div className="chat-err">
                  <div className="chat-err-text">Gemini is busy right now. Please try again.</div>
                  <button className="btn-retry-chat" onClick={() => retryChat(m.question, m.snapshot)}>
                    🔄 Retry
                  </button>
                </div>
              </div>
            );
            return (
              <div key={i} className={`msg ${m.role}`}>
                {m.role === 'bot' && <div className="msg-av">👨‍⚕️</div>}
                <div className="msg-bubble">{m.text}</div>
              </div>
            );
          })}

          {/* Typing indicator */}
          {busy && (
            <div className="msg bot">
              <div className="msg-av">👨‍⚕️</div>
              <div className="msg-bubble typing-bub">
                <span className="dot"/><span className="dot"/><span className="dot"/>
              </div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>
      )}

      {/* Inline suggestion chips after first exchange */}
      {msgs.length > 0 && !busy && (
        <div className="chips-bar">
          {shownChips.map(s => (
            <button key={s} className="chip" onClick={() => send(s)} disabled={busy}>{s}</button>
          ))}
        </div>
      )}

      {/* Sticky input bar */}
      <div className="chat-input-bar">
        <textarea
          ref={textareaRef}
          className="chat-textarea"
          rows={1}
          placeholder="Ask anything about your report…"
          value={input}
          onInput={onInput}
          onChange={e => setInput(e.target.value)}
          onKeyDown={onKey}
          disabled={busy}
        />
        <button className="chat-send" onClick={() => send()} disabled={busy || !input.trim()} title="Send">
          {busy ? '…' : '↑'}
        </button>
      </div>
    </div>
  );
}

  );

/* ── Auth screens (email + password signup/login) ──────────────────────── */
function AuthScreens({ onSignUp, onSignIn }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [emailFocus, setEmailFocus] = useState(false);
  const [password, setPassword] = useState('');
  const [passwordFocus, setPasswordFocus] = useState(false);
  const [confirm, setConfirm] = useState('');
  const [confirmFocus, setConfirmFocus] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email.trim() || !password.trim() || busy) return;
    if (isSignUp && password !== confirm) {
      setErr('Passwords do not match');
      return;
    }
    if (password.length < 8) {
      setErr('Password must be at least 8 characters');
      return;
    }
    setBusy(true); setErr('');
    const { error } = isSignUp
      ? await onSignUp(email.trim(), password)
      : await onSignIn(email.trim(), password);
    if (error) { setErr(error.message); }
    setBusy(false);
  };

  return (
    <div className="login-wrap">
      <div className="hero-badge" style={{ marginBottom: 30 }}>✦ AI-Powered Medical Analysis</div>
      <h1 className="hero-h1" style={{ marginBottom: 20 }}>
        Welcome to<br/><span className="grad">MedBot</span>
      </h1>
      <p className="hero-sub" style={{ marginBottom: 40 }}>
        Understand your medical reports with AI analysis and insights.
      </p>

      <div className="login-card">
        <div className="login-icon">⚕</div>

        <form onSubmit={handleSubmit}>
          <div className="login-h">{isSignUp ? 'Create Account' : 'Sign In'}</div>
          <div className="login-sub">{isSignUp ? 'Sign up to get started' : 'Sign in to your account'}</div>

          <div className="field">
            <label className={`field-label ${email || emailFocus ? 'up' : ''}`}>
              Email address
            </label>
            <input className="field-input" type="email" value={email}
              onChange={e => setEmail(e.target.value)}
              onFocus={() => setEmailFocus(true)}
              onBlur={() => setEmailFocus(false)}
              placeholder={emailFocus ? 'you@example.com' : ''}
              required
            />
          </div>

          <div className="field">
            <label className={`field-label ${password || passwordFocus ? 'up' : ''}`}>
              Password {isSignUp && <span style={{ fontSize: 12, color: '#64748b' }}>(min 8 chars)</span>}
            </label>
            <input className="field-input" type="password" value={password}
              onChange={e => setPassword(e.target.value)}
              onFocus={() => setPasswordFocus(true)}
              onBlur={() => setPasswordFocus(false)}
              placeholder={passwordFocus ? '••••••••' : ''}
              required
            />
          </div>

          {isSignUp && (
            <div className="field">
              <label className={`field-label ${confirm || confirmFocus ? 'up' : ''}`}>
                Confirm password
              </label>
              <input className="field-input" type="password" value={confirm}
                onChange={e => setConfirm(e.target.value)}
                onFocus={() => setConfirmFocus(true)}
                onBlur={() => setConfirmFocus(false)}
                placeholder={confirmFocus ? '••••••••' : ''}
                required={isSignUp}
              />
            </div>
          )}

          {err && (
            <div style={{ padding: '10px 14px', background: 'rgba(239,68,68,.08)',
              border: '1px solid rgba(239,68,68,.2)', borderRadius: 10,
              fontSize: 13, color: '#dc2626', marginBottom: 16 }}>
              {err}
            </div>
          )}

          <button className="btn" type="submit" disabled={busy || !email.trim() || !password.trim()}
            style={{ marginTop: 8 }}>
            {busy ? (isSignUp ? 'Creating…' : 'Signing in…') : (isSignUp ? 'Create Account →' : 'Sign In →')}
          </button>
        </form>

        <div style={{ textAlign: 'center', marginTop: 16, fontSize: 14, color: '#64748b' }}>
          {isSignUp ? 'Already have an account? ' : "Don't have an account? "}
          <button className="btn-back-link" style={{ marginTop: 0 }}
            onClick={() => { setIsSignUp(!isSignUp); setErr(''); setPassword(''); setConfirm(''); }}>
            {isSignUp ? 'Sign In' : 'Sign Up'}
          </button>
        </div>
      </div>
    </div>
  );
}

  const textareaRef = useRef(null);
  const { list: toasts, add: toast } = useToast();

  const SUGGESTIONS = [
    "Compare my recent reports",
    "Is my cholesterol improving?",
    "What should I focus on next?",
    "Explain my latest results",
  ];

  useEffect(() => {
    apiFetch('/reports').then(data => {
      const rpts = data.reports || [];
      setReports(rpts);
      if (!selectedReportId && rpts.length > 0) {
        setSelectedReportId(rpts[0].id);
      }
    }).catch(e => toast('Failed to load reports', 'error'));

    apiFetch('/chat/history').then(data => {
      setChatMessages(data.messages || []);
    }).catch(() => {});
  }, []);

  useEffect(() => {
    if (!selectedReportId) return;
    setLoadingText(true);
    apiFetch(`/reports/${selectedReportId}`).then(data => {
      const rep = data.report;
      setReportObj(rep);
      setReportText(rep?.full_text || 'No report text available');
      setLoadingText(false);
    }).catch(() => {
      setReportText('Failed to load report text');
      setLoadingText(false);
    });
  }, [selectedReportId]);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [chatMessages, busy]);

  const send = async (text) => {
    const q = (text || input).trim();
    if (!q || busy || !selectedReportId) return;
    setInput('');
    setBusy(true);
    setChatError('');

    const userMsg = { role: 'user', content: q, created_at: new Date().toISOString() };
    setChatMessages(p => [...p, userMsg]);

    try {
      const historyForApi = chatMessages.slice(-10).map(m => ({ role: m.role === 'assistant' ? 'bot' : m.role, text: m.content }));
      const res = await apiFetch('/chat', {
        method: 'POST',
        body: JSON.stringify({ report_id: selectedReportId, question: q, history: historyForApi }),
      });
      setChatMessages(p => [...p, { role: 'assistant', content: res.reply, created_at: new Date().toISOString() }]);
    } catch (e) {
      setChatError(e.message);
      toast('Chat failed: ' + e.message, 'error');
    } finally {
      setBusy(false);
      setTimeout(() => textareaRef.current?.focus(), 50);
    }
  };

  const onInput = e => {
    setInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
  };

  return (
    <div style={{ display: 'flex', gap: '16px', height: 'calc(100vh - 120px)', padding: '16px', maxWidth: '100%', overflow: 'hidden' }}>
      {/* Left: Raw Report Text (55%) */}
      <div style={{ flex: '0 0 55%', display: 'flex', flexDirection: 'column', background: '#fff', border: '1px solid rgba(20,184,166,.14)', borderRadius: '16px', overflow: 'hidden' }}>
        <div style={{ padding: '16px', borderBottom: '1px solid rgba(0,0,0,.06)', display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ fontSize: '13px', fontWeight: '700', color: '#94a3b8', whiteSpace: 'nowrap' }}>Viewing:</span>
          <select value={selectedReportId || ''} onChange={e => setSelectedReportId(e.target.value)} style={{ flex: 1, padding: '8px 12px', border: '1px solid rgba(20,184,166,.22)', borderRadius: '8px', fontSize: '13px' }}>
            {reports.map(r => (
              <option key={r.id} value={r.id}>
                {r.file_name} — {new Date(r.uploaded_at).toLocaleDateString()}
              </option>
            ))}
          </select>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: '20px', background: '#fafafa' }}>
          {loadingText ? (
            <div style={{ textAlign: 'center', padding: '40px', color: '#94a3b8' }}>Loading report…</div>
          ) : (
            <pre style={{
              fontFamily: "'Courier New', monospace",
              fontSize: '11px',
              lineHeight: '1.7',
              color: '#1e293b',
              whiteSpace: 'pre-wrap',
              wordBreak: 'break-word',
              margin: 0,
              background: '#fff',
              padding: '16px',
              borderRadius: '8px',
              border: '1px solid rgba(20,184,166,.1)',
            }}>
              {reportText}
            </pre>
          )}
        </div>
      </div>

      {/* Right: Chat (45%) */}
      <div style={{ flex: '0 0 calc(45% - 16px)', display: 'flex', flexDirection: 'column', background: '#fff', border: '1px solid rgba(20,184,166,.14)', borderRadius: '16px', overflow: 'hidden' }}>
        <div style={{ padding: '16px', borderBottom: '1px solid rgba(0,0,0,.06)', fontWeight: '700' }}>💬 Ask MedBot</div>

        {chatMessages.length === 0 && !busy ? (
          <div style={{ flex: 1, padding: '20px', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center' }}>
            <div style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '12px' }}>Start a conversation about your reports</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', justifyContent: 'center' }}>
              {SUGGESTIONS.map(s => (
                <button key={s} className="chip" onClick={() => send(s)} disabled={busy} style={{ fontSize: '12px' }}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div style={{ flex: 1, overflowY: 'auto', padding: '16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
            {chatMessages.map((m, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                {m.role === 'user' ? (
                  <div style={{
                    maxWidth: '80%', padding: '12px 14px', borderRadius: '14px',
                    fontSize: '13px', lineHeight: '1.6',
                    background: 'linear-gradient(135deg, #14b8a6, #06b6d4)', color: '#fff',
                    whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  }}>
                    {m.content}
                  </div>
                ) : (
                  <div className="chat-md" style={{
                    maxWidth: '80%', padding: '12px 14px', borderRadius: '14px',
                    fontSize: '13px', lineHeight: '1.6',
                    background: '#f1f5f9', color: '#0f172a',
                    wordBreak: 'break-word',
                  }} dangerouslySetInnerHTML={{ __html: typeof marked !== 'undefined' ? marked.parse(m.content || '') : m.content }} />
                )}
              </div>
            ))}
            {busy && (
              <div style={{ display: 'flex', gap: '5px', padding: '12px 14px' }}>
                <span className="dot" /><span className="dot" /><span className="dot" />
              </div>
            )}
            {chatError && (
              <div style={{ padding: '10px 14px', background: 'rgba(239,68,68,.08)', border: '1px solid rgba(239,68,68,.2)', borderRadius: '10px', fontSize: '13px', color: '#dc2626' }}>
                {chatError}
              </div>
            )}
            <div ref={bottomRef} />
          </div>
        )}

        <div style={{ padding: '12px', borderTop: '1px solid rgba(0,0,0,.06)', display: 'flex', gap: '8px', alignItems: 'flex-end' }}>
          <textarea ref={textareaRef} className="chat-textarea" rows={1} placeholder="Ask about your reports…" value={input} onInput={onInput} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} disabled={busy} style={{ flex: 1 }} />
          <button className="chat-send" onClick={() => send()} disabled={busy || !input.trim()} style={{ marginBottom: 0 }}>
            {busy ? '…' : '↑'}
          </button>
        </div>
      </div>

      {/* Toasts */}
      <div className="toasts">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`}>
            <span className="toast-icon">{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────────────── */
function App() {
  const { user, loading: authLoading, authEnabled, signUp, signIn, signOut } = useAuth();
  const [key, setKey] = useState(GEMINI_API_KEY);
  const [focused, setFocused] = useState(false);
  const [file, setFile] = useState(null);
  const [over, setOver] = useState(false);
  const [screen, setScreen] = useState('upload'); // upload | loading | results
  const [step, setStep] = useState(0);
  const [result, setResult] = useState(null);
  const [reportId, setReportId] = useState(null);
  const [anonText, setAnonText] = useState('');
  const [consent, setConsent] = useState(false);
  const ref = useRef(null);
  const { list: toasts, add: toast } = useToast();

  const isLoggedIn = !authEnabled || !!user;
  const [tab, setTab] = useState('upload'); // upload | reports | chat
  const [selectedReportForAnalysis, setSelectedReportForAnalysis] = useState(null);

  useEffect(() => {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }, []);

  const pickFile = useCallback((f) => {
    if (!f) return;
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['pdf', 'txt'].includes(ext)) { toast('Please upload a PDF or TXT file.', 'error'); return; }
    if (f.size > 20 * 1024 * 1024) { toast('File too large — max 20 MB.', 'error'); return; }
    setFile(f);
    toast(`${f.name} ready`, 'success');
  }, [toast]);

  const canGo = file !== null && (GEMINI_API_KEY || key.trim().length > 8 || authEnabled);

  const begin = async () => {
    if (!canGo) return;
    try {
      setStep(0); setScreen('loading');
      const raw = await readFile(file);
      setStep(1);
      const anon = redact(raw);
      setAnonText(anon);
      setStep(2);
      setScreen('upload');
      setConsent(true);
    } catch (e) {
      toast(`Could not read file: ${e.message}`, 'error');
      setScreen('upload');
    }
  };

  const runAnalysis = useCallback(async (textToAnalyze) => {
    setScreen('loading'); setStep(2);
    try {
      await new Promise(r => setTimeout(r, 400));
      setStep(3);

      let analysisResult;
      if (authEnabled && user) {
        const uploadRes = await uploadReport(file?.name || 'report.txt', textToAnalyze);
        const rid = uploadRes.report_id;
        setReportId(rid);
        const analyzeRes = await analyzeReport(rid);
        analysisResult = analyzeRes.analysis;
      } else {
        analysisResult = await callGemini(key, textToAnalyze);
      }

      setStep(4);
      await new Promise(res => setTimeout(res, 300));
      setResult(analysisResult);
      setScreen('results');
      toast('Analysis complete!', 'success');
    } catch (e) {
      if (isRetryable(e)) {
        setScreen('error');
      } else {
        toast(`Analysis failed: ${e.message}`, 'error');
        setScreen('upload');
      }
    }
  }, [key, authEnabled, user, file]);

  const confirmConsent = async () => {
    setConsent(false);
    await runAnalysis(anonText);
  };

  const completeUpload = async () => {
    if (reportId) {
      try {
        const res = await apiFetch(`/reports/${reportId}`);
        const report = res.report;
        setSelectedReportForAnalysis(report);
        setTab('reports');
        setScreen('upload');
        setFile(null);
        setResult(null);
        setAnonText('');
        setStep(0);
        return;
      } catch (e) {
        console.error('Failed to fetch report:', e);
      }
    }
    setTab('reports');
    reset();
  };

  const reset = () => { setScreen('upload'); setFile(null); setResult(null); setReportId(null); setAnonText(''); setStep(0); };

  return (
    <>
      {/* Navbar */}
      <nav className="nav" style={{ flexDirection: 'column', height: 'auto', padding: '0', paddingTop: '0' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 32px', height: '64px', borderBottom: '1px solid rgba(20,184,166,.14)' }}>
          <div className="nav-logo">
            <div className="nav-logo-mark">⚕</div>
            MedBot
          </div>
          {isLoggedIn && user ? (
            <div className="nav-user">
              <span className="nav-email">{user.email}</span>
              <button className="btn-logout" onClick={signOut}>Sign out</button>
            </div>
          ) : (
            <div className="nav-pill">
              <div className="nav-dot"/>
              Gemini 2.5 Flash
            </div>
          )}
        </div>

        {isLoggedIn && user && (
          <div style={{ display: 'flex', gap: '0', padding: '0 32px', borderBottom: '1px solid rgba(20,184,166,.14)', alignItems: 'center' }}>
            {['upload', 'reports', 'chat'].map(t => (
              <button key={t} onClick={() => setTab(t)} style={{
                padding: '12px 20px',
                background: 'none',
                border: 'none',
                fontSize: '14px',
                fontWeight: t === tab ? '700' : '500',
                color: t === tab ? '#14b8a6' : '#94a3b8',
                borderBottom: t === tab ? '2px solid #14b8a6' : 'none',
                cursor: 'pointer',
                transition: 'all .2s',
              }}>
                {t === 'upload' ? '+ Upload' : t === 'reports' ? 'My Reports' : '💬 Chat'}
              </button>
            ))}
          </div>
        )}
      </nav>

      {/* Auth loading */}
      {authEnabled && authLoading && (
        <div className="loading-wrap">
          <div className="loading-card" style={{ padding: '48px 40px' }}>
            <div className="spinner"/>
            <div className="loading-sub">Checking authentication…</div>
          </div>
        </div>
      )}

      {/* Login screen — shown when auth is enabled but user is not logged in */}
      {authEnabled && !authLoading && !user && (
        <AuthScreens onSignUp={signUp} onSignIn={signIn}/>
      )}

      {/* Tab: Upload — shown when user clicks Upload tab */}
      {isLoggedIn && !authLoading && user && tab === 'upload' && screen === 'upload' && (
        <div className="hero">
          <div className="hero-badge">✦ AI-Powered Medical Analysis</div>
          <h1 className="hero-h1">Understand Your<br/><span className="grad">Medical Reports</span></h1>
          <p className="hero-sub">
            Upload any medical report and receive plain-English insights from MedBot,
            your AI medical analyst — with automatic privacy protection built in.
          </p>

          <div className="card upload-card">
            {/* API key — hidden when pre-filled or when logged in (backend has key) */}
            {!GEMINI_API_KEY && !(authEnabled && user) && (
              <div className="field">
                <label className={`field-label ${key || focused ? 'up' : ''}`}>
                  Google Gemini API Key
                </label>
                <input className="field-input" type="password" value={key}
                  onChange={e => setKey(e.target.value)}
                  onFocus={() => setFocused(true)}
                  onBlur={() => setFocused(false)}
                  placeholder={focused ? 'AIza…' : ''}
                />
              </div>
            )}

            {/* Dropzone */}
            <div className={`dropzone ${over ? 'over' : ''}`}
              onDragOver={e => { e.preventDefault(); setOver(true); }}
              onDragLeave={() => setOver(false)}
              onDrop={e => { e.preventDefault(); setOver(false); pickFile(e.dataTransfer.files[0]); }}
              onClick={() => ref.current?.click()}
            >
              <input ref={ref} type="file" accept=".pdf,.txt" style={{ display: 'none' }}
                onChange={e => pickFile(e.target.files[0])}/>
              <div className="dz-icon">{over ? '📂' : '📄'}</div>
              <div className="dz-title">{over ? 'Release to upload' : 'Upload Medical Report'}</div>
              <div className="dz-sub">Drag & drop or click to browse</div>
              <div className="dz-badges">
                <span className="dz-badge">PDF</span>
                <span className="dz-badge">TXT</span>
                <span className="dz-badge">Max 20 MB</span>
              </div>
            </div>

            {/* File chip */}
            {file && (
              <div className="file-chip">
                <div className="file-chip-icon">{file.name.endsWith('.pdf') ? '📕' : '📝'}</div>
                <div className="file-chip-info">
                  <div className="file-chip-name">{file.name}</div>
                  <div className="file-chip-size">{(file.size / 1024).toFixed(1)} KB</div>
                </div>
                <button className="file-chip-rm"
                  onClick={e => { e.stopPropagation(); setFile(null); }}>✕</button>
              </div>
            )}

            <button className="btn" onClick={begin} disabled={!canGo}>
              {canGo ? 'Analyze with MedBot →'
                : !file ? (authEnabled && user ? 'Upload a report to continue' : (!key && !GEMINI_API_KEY ? 'Enter your Gemini API key to continue' : 'Upload a report to continue'))
                : 'Upload a report to continue'}
            </button>
            <div className="note">🔒 PII auto-removed before AI · No data stored · Educational use only</div>
          </div>

          <div className="features">
            {['PII Auto-Redaction', 'Plain-English Results', 'Severity Scoring', 'Actionable Insights', 'Privacy-First'].map(f => (
              <div key={f} className="feat"><div className="feat-dot"/>{f}</div>
            ))}
          </div>
        </div>
      )}

      {/* Loading */}
      {isLoggedIn && screen === 'loading' && <LoadingScreen step={step}/>}

      {/* Analysis error */}
      {isLoggedIn && screen === 'error' && (
        <div className="loading-wrap">
          <div className="loading-card err-screen">
            <div className="err-icon">⚠️</div>
            <div className="err-h">Gemini is busy right now</div>
            <div className="err-sub">The API is under high demand. Your report is still ready — just try again.</div>
            <button className="btn-retry-main" onClick={() => runAnalysis(anonText)}>
              🔄 Retry
            </button>
            <button className="btn-back-link" onClick={() => setScreen('upload')}>
              ← Go back
            </button>
          </div>
        </div>
      )}

      {/* Upload Success State */}
      {isLoggedIn && user && tab === 'upload' && screen === 'results' && result && (
        <div style={{ maxWidth: '640px', margin: '80px auto', padding: '24px' }}>
          <div style={{ background: '#fff', border: '1px solid rgba(20,184,166,.14)', borderRadius: '24px', padding: '64px 40px', textAlign: 'center' }}>
            <div style={{ fontSize: '48px', marginBottom: '24px' }}>✅</div>
            <div style={{ fontSize: '24px', fontWeight: '900', marginBottom: '8px' }}>Analysis Complete!</div>
            <div style={{ fontSize: '14px', color: '#94a3b8', marginBottom: '32px' }}>
              We've analyzed your report and it's now in your reports library.
            </div>
            <div style={{ display: 'flex', gap: '12px', flexDirection: 'column' }}>
              <button className="btn" onClick={completeUpload} style={{ marginTop: 0 }}>
                📋 View Analysis →
              </button>
              <button className="btn" onClick={reset} style={{ marginTop: 0, background: 'rgba(20,184,166,.1)', color: '#14b8a6' }}>
                + Upload Another Report
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Tab: My Reports */}
      {isLoggedIn && user && tab === 'reports' && (
        <MyReportsPage
          selectedForDetail={selectedReportForAnalysis}
          onSelectReport={setSelectedReportForAnalysis}
          onAskMedBot={reportId => {
            setReportId(reportId);
            setTab('chat');
          }}
        />
      )}

      {/* Tab: Chat Split-Screen */}
      {isLoggedIn && user && tab === 'chat' && (
        <ChatSplitScreen initialReportId={reportId} />
      )}

      {/* Consent modal */}
      {isLoggedIn && consent && (
        <ConsentModal
          preview={anonText}
          onConfirm={confirmConsent}
          onCancel={() => { setConsent(false); setScreen('upload'); }}
        />
      )}

      {/* Toasts */}
      <div className="toasts">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`}>
            <span className="toast-icon">{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
